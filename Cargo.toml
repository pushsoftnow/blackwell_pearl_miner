[package]
name = "blackwell_pearl_miner"
version = "0.1.0"
edition = "2021"
license = "ISC"
description = "PearlHash pool miner for NVIDIA Blackwell GPUs (compute capability 12.0)"
readme = "README.md"
publish = false
build = "build.rs"

[[bin]]
name = "bpm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.21"
bincode = "1.3.3"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
flate2 = "1.1"
getrandom = "0.2"
libc = "0.2"
primitive-types = "0.12.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
pearl-blake3 = { path = "third_party/pearl/pearl-blake3", features = ["serde"] }
zk-pow = { path = "third_party/pearl/zk-pow" }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
